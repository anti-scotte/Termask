[package]
name = "termask-workbench"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termask_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 开机自启：设置页「开机启动」开关
tauri-plugin-autostart = "2"
# 全局快捷键：Ctrl+Shift+Q 唤起（设置页可配置，本机注册失败不 panic）
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
# 本地桥接服务：接收浏览器扩展推送（仅监听 127.0.0.1）
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tauri-plugin-updater = "2.14.1"
printpdf = { version = "0.7", features = ["font_subsetting"] }
# DOCX 手写 ZIP：deflate 压缩 + CRC32（本就是 tauri 的传递依赖）
flate2 = "1"
crc32fast = "1"
resvg = "0.49.0"
tauri-plugin-dialog = "2.8.4"
# 邮箱验证码的真实投递（SMTP over STARTTLS/SSL），纯 Rust TLS，无系统 OpenSSL 依赖。
# 关闭默认特性，只启用 builder + smtp-transport + rustls-tls，避免拉入 tokio1/async-std/native-tls 全量树。
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
